<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us · Bubble Businesses</title>
    <meta
      name="description"
      content="Contact the Bubble Businesses team to discuss your AI automation and consulting needs."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/images/bubble-favicon.svg" />
    <link rel="stylesheet" href="/assets/styles/styles.css" />
    <link rel="canonical" href="https://bubbleinvest.org/en/professionals/contact" />
    <link rel="alternate" hreflang="en" href="https://bubbleinvest.org/en/professionals/contact" />
    <link rel="alternate" hreflang="fr" href="https://bubbleinvest.org/professionals/contact" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="professionals-contact-page">
    <!-- Navigation Header -->
    <header class="header">
      <nav class="navbar">
        <div class="container">
          <div class="navbar-content">
            <a href="/en" class="navbar-logo">
              <img src="/assets/images/bubble-logo.svg" alt="Bubble Invest" class="logo" width="140" height="28" />
            </a>
            <div class="navbar-nav">
              <a href="/en" data-translate="nav.home">Home</a>
              <a href="/en/investors" data-translate="nav.investors">Investors</a>
              <a href="/en/professionals" data-translate="nav.professionals">Professionals</a>
              <a href="/en/blog" data-translate="nav.blog">Blog</a>
              <a href="/en/#waitlist" data-translate="nav.join">Join Us</a>
            </div>
            <div class="navbar-lang">
              <button class="lang-toggle" data-lang="fr" title="Switch to French">FR</button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero fade-in">
      <div class="container">
        <h1 data-translate="professionals.contact.title">Let's Discuss Your Project</h1>
        <p class="hero-subtitle" data-translate="professionals.contact.subtitle">
          Fill out the form and our team will get back to you shortly to discuss your needs.
        </p>
      </div>
    </section>

    <!-- Contact Section -->
    <section class="contact-section fade-in">
      <div class="container">
        <div class="contact-form-wrapper">
          <form id="professionals-contact-form" class="contact-form">
            <div class="form-group">
              <label for="company_name" data-translate="professionals.contact.form.company">Company Name</label>
              <input type="text" id="company_name" name="company_name" required />
            </div>

            <div class="form-group">
              <label for="full_name" data-translate="professionals.contact.form.name">Full Name</label>
              <input type="text" id="full_name" name="full_name" required />
            </div>

            <div class="form-group">
              <label for="email" data-translate="professionals.contact.form.email">Email Address</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="phone" data-translate="professionals.contact.form.phone">Phone (Optional)</label>
              <input type="tel" id="phone" name="phone" />
            </div>

            <div class="form-group">
              <label for="role" data-translate="professionals.contact.form.role">Your Role</label>
              <select id="role" name="role" required>
                <option value="" data-translate="professionals.contact.form.role.placeholder">Select your role</option>
                <option value="founder" data-translate="professionals.contact.form.role.founder">Founder/CEO</option>
                <option value="cfo" data-translate="professionals.contact.form.role.cfo">CFO/Finance Director</option>
                <option value="cto" data-translate="professionals.contact.form.role.cto">CTO/Tech Director</option>
                <option value="operations" data-translate="professionals.contact.form.role.operations">Operations Director</option>
                <option value="wealth_manager" data-translate="professionals.contact.form.role.wealth">Wealth Manager</option>
                <option value="consultant" data-translate="professionals.contact.form.role.consultant">Consultant/Partner</option>
                <option value="other" data-translate="professionals.contact.form.role.other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="company_type" data-translate="professionals.contact.form.type">Organization Type</label>
              <select id="company_type" name="company_type" required>
                <option value="" data-translate="professionals.contact.form.type.placeholder">Select type</option>
                <option value="fintech" data-translate="professionals.contact.form.type.fintech">Fintech/Crypto</option>
                <option value="robo_advisor" data-translate="professionals.contact.form.type.robo">Robo-Advisor</option>
                <option value="broker" data-translate="professionals.contact.form.type.broker">Broker</option>
                <option value="bank" data-translate="professionals.contact.form.type.bank">Traditional Bank</option>
                <option value="wealth_firm" data-translate="professionals.contact.form.type.wealth">Wealth Management</option>
                <option value="asset_manager" data-translate="professionals.contact.form.type.asset">Asset Manager</option>
                <option value="consulting" data-translate="professionals.contact.form.type.consulting">Consulting Firm</option>
                <option value="other" data-translate="professionals.contact.form.type.other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="challenge" data-translate="professionals.contact.form.challenge">What is your main challenge?</label>
              <textarea id="challenge" name="challenge" rows="4" placeholder="Describe your situation..." required></textarea>
            </div>

            <div class="form-group">
              <label for="budget" data-translate="professionals.contact.form.budget">Estimated Budget</label>
              <select id="budget" name="budget" required>
                <option value="" data-translate="professionals.contact.form.budget.placeholder">Select a range</option>
                <option value="0-10k" data-translate="professionals.contact.form.budget.small">€0 - €10k</option>
                <option value="10-30k" data-translate="professionals.contact.form.budget.medium">€10k - €30k</option>
                <option value="30k+" data-translate="professionals.contact.form.budget.large">€30k+</option>
                <option value="exploring" data-translate="professionals.contact.form.budget.exploring">Still exploring</option>
              </select>
            </div>

            <div class="form-group">
              <label for="timeline" data-translate="professionals.contact.form.timeline">Desired Timeline</label>
              <select id="timeline" name="timeline" required>
                <option value="" data-translate="professionals.contact.form.timeline.placeholder">Select timeline</option>
                <option value="urgent" data-translate="professionals.contact.form.timeline.urgent">Urgent (1-2 months)</option>
                <option value="soon" data-translate="professionals.contact.form.timeline.soon">Soon (2-3 months)</option>
                <option value="flexible" data-translate="professionals.contact.form.timeline.flexible">Flexible (3+ months)</option>
                <option value="exploring" data-translate="professionals.contact.form.timeline.exploring">Still exploring</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message" data-translate="professionals.contact.form.message">Additional Message (Optional)</label>
              <textarea id="message" name="message" rows="4" placeholder="Any additional information you'd like to share..."></textarea>
            </div>

            <button type="submit" class="cta-button primary-btn" data-translate="professionals.contact.form.submit">Send My Request</button>

            <p class="form-note" data-translate="professionals.contact.form.note">
              We typically respond within 24 hours.
            </p>
          </form>
        </div>
      </div>
    </section>

    <!-- Floating Chat Input -->
    <div id="floating-chat-input" class="floating-chat-input hidden">
      <div class="floating-input-container">
        <input
          type="text"
          class="floating-input-field"
          placeholder="Ask me anything..."
          data-translate-placeholder="floating_input.placeholder"
          aria-label="Ask a question"
        />
        <button class="floating-input-submit" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 10L12 3L19 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 21V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Chat Side Panel -->
    <div id="chat-side-panel" class="chat-side-panel" aria-hidden="true">
      <div class="chat-side-panel-header">
        <div class="chat-side-panel-header-info">
          <img src="/assets/images/bubble-favicon.svg" class="chat-side-panel-icon" alt="Bubble" width="20" height="20" />
          <div class="chat-side-panel-titles">
            <span class="chat-side-panel-title">Bubble Assistant</span>
          </div>
        </div>
        <div class="chat-side-panel-actions">
          <button class="chat-side-panel-minimize" aria-label="Minimize chat" type="button">-</button>
          <button class="chat-side-panel-close" aria-label="Close chat" type="button">✕</button>
        </div>
      </div>
      <div class="chat-side-panel-messages" role="log" aria-live="polite">
        <div class="chat-side-panel-message bot">
          <div class="message-content">
            Hello, I'm Bubble — how can I help you?
          </div>
        </div>
      </div>
      <form class="chat-side-panel-input-container" novalidate>
        <input
          type="text"
          class="chat-side-panel-input"
          placeholder="Ask your questions..."
          data-translate-placeholder="floating_input.placeholder"
          aria-label="Type your message"
          autocomplete="off"
        />
        <button class="chat-side-panel-send" aria-label="Send message" type="submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 10L12 3L19 10" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 21V4" stroke-linecap="round" />
          </svg>
        </button>
      </form>
    </div>

    <!-- Scripts -->
    <script src="/i18n/translations.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/chatbot-logic.js"></script>
    <script src="/js/chatbot-animations.js"></script>
    <script src="/js/chat-side-panel.js"></script>
    <script src="/js/floating-chat-input.js"></script>
  </body>
</html>
