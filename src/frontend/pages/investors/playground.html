<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bubble Playground</title>
    <meta name="description" content="Découvre l'investissement avec l'IA. Expérience conversationnelle 100% gratuite." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/bubble-favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/styles/styles.css" />
    <link rel="stylesheet" href="/assets/styles/playground-fullscreen.css" />
  </head>
  <body class="playground-fullscreen-body">

    <!-- FULL-SCREEN CHATBOT OVERLAY -->
    <div class="playground-fullscreen" id="playgroundFullscreen">

      <!-- Header -->
      <header class="playground-header">
        <a href="/investors" class="playground-logo">
          <svg width="32" height="32" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="36" cy="41" r="26" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-dasharray="145 29" stroke-dashoffset="10"/>
            <circle cx="59" cy="21" r="6" fill="#000"/>
          </svg>
          <span class="playground-logo-text">Bubble.</span>
        </a>
        <div class="playground-header-actions">
          <button class="playground-lang-toggle" id="langToggle" aria-label="Switch language">
            <span class="lang-current">FR</span>
          </button>
          <a href="/investors/playground/resources" class="playground-close-btn" id="exitChatbot" aria-label="Fermer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </a>
        </div>
      </header>

      <!-- Chat Container - Takes full viewport -->
      <main class="playground-chat-main">
        <div class="playground-chat-wrapper">

          <!-- Messages Area -->
          <div class="playground-messages" id="playgroundMessages">
            <!-- Messages will be dynamically added -->
          </div>

          <!-- Input Area -->
          <div class="playground-input-area">
            <form class="playground-input-form" id="playgroundForm">
              <input
                type="text"
                class="playground-input"
                id="playgroundInput"
                placeholder="Tape ici ou utilise le micro..."
                data-translate-placeholder="playground.input.placeholder"
                autocomplete="off"
              />
              <button type="button" class="playground-mic-btn" id="playgroundMicBtn" aria-label="Reconnaissance vocale">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="23"/>
                  <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
              </button>
              <button type="submit" class="playground-send-btn" aria-label="Envoyer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 10L12 3L19 10" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M12 21V4" stroke-linecap="round" />
                </svg>
              </button>
            </form>

            <!-- Persistent Action Buttons - SVG Icons Only -->
            <div class="playground-quick-actions">
              <a href="/investors/education/arena" class="playground-action" data-action="arena">
                <span class="action-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </span>
                <span data-translate="playground.action.arena">Arena</span>
              </a>
              <a href="/investors/education/simulator" class="playground-action" data-action="simulator">
                <span class="action-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                  </svg>
                </span>
                <span data-translate="playground.action.simulator">Simulateur</span>
              </a>
              <a href="/investors/playground/resources" class="playground-action purple" data-action="explore">
                <span class="action-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    <path d="M2 12h20"/>
                  </svg>
                </span>
                <span data-translate="playground.action.explore">Explorer le Playground</span>
              </a>
              <a href="/investors#investor-waitlist" class="playground-action primary" data-action="subscribe">
                <span class="action-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
                    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
                  </svg>
                </span>
                <span data-translate="playground.action.subscribe">Rejoindre Bubble</span>
              </a>
            </div>
          </div>

        </div>
      </main>

    </div>

    <!-- Scripts -->
    <script src="/i18n/translations.js"></script>
    <script src="/js/language-switcher.js"></script>
    <script src="/js/playground-fullscreen-chat.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Initialize the full-screen playground chatbot
        if (typeof PlaygroundFullscreenChat !== 'undefined') {
          PlaygroundFullscreenChat.init();
        }

        // Language toggle
        const langToggle = document.getElementById('langToggle');
        if (langToggle) {
          langToggle.addEventListener('click', function() {
            const currentLang = localStorage.getItem('bubbleLanguage') || 'fr';
            const newLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('bubbleLanguage', newLang);

            // Clear playground session to avoid language mixing in conversation history
            sessionStorage.removeItem('bubblePlaygroundFullscreenSession');

            // Redirect to corresponding language version
            if (newLang === 'en') {
              window.location.href = '/en/investors/playground';
            } else {
              window.location.href = '/investors/playground';
            }
          });
        }
      });
    </script>
  </body>
</html>
