<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble Workflow Demo - Test Page</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/bubble-favicon.svg" />
    <link rel="stylesheet" href="/assets/styles/styles.css" />
    <link rel="stylesheet" href="/assets/styles/pricing-workflow-demo.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Full-Page Workflow Demo Overlay -->
    <div id="workflow-demo-overlay" class="workflow-demo-overlay">
      <!-- Close Button (Always Visible) -->
      <button class="workflow-demo-close" id="workflow-demo-close" aria-label="Close demo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6L18 18" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- Scrollable Chat Container -->
      <div class="workflow-demo-chat-container">
        <div class="workflow-demo-chat-header">
          <div class="workflow-demo-header-info">
            <img src="/assets/images/bubble-favicon.svg" class="workflow-demo-icon" alt="Bubble" width="28" height="28" />
            <div class="workflow-demo-titles">
              <span class="workflow-demo-title">Bubble AI Agent</span>
              <span class="workflow-demo-subtitle">Interactive Demo</span>
            </div>
          </div>
          <div class="language-switcher-demo">
            <button id="fr-demo-switch" class="active">FR</button>
            <button id="en-demo-switch">EN</button>
          </div>
        </div>

        <!-- Scrollable Messages Area -->
        <div class="workflow-demo-messages" id="workflow-demo-messages" role="log" aria-live="polite">
          <!-- Messages will be dynamically inserted here -->
        </div>

        <!-- Input Field -->
        <div class="workflow-demo-input-container">
          <textarea class="workflow-demo-input-field" placeholder="" readonly></textarea>
          <button class="workflow-demo-send-button" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 10L12 3L19 10" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 21V4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Hidden Pricing Content (Shown After Demo) -->
    <div id="pricing-content" class="pricing-content hidden">
      <header>
        <div class="container">
          <div class="brand">
            <a href="/" class="logo-link">
              <div class="logo" style="display: flex; align-items: center; gap: 0.18em">
                <span style="display: flex; align-items: center">
                  <svg
                    width="36"
                    height="36"
                    viewBox="0 0 72 72"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    style="display: inline-block; vertical-align: middle"
                  >
                    <circle
                      cx="36"
                      cy="41"
                      r="26"
                      stroke="#000"
                      stroke-width="6"
                      stroke-linecap="round"
                      stroke-dasharray="145 29"
                      stroke-dashoffset="10"
                    />
                    <circle cx="59" cy="21" r="6" fill="#000" />
                  </svg>
                </span>
                <span>Bubble.</span>
              </div>
            </a>
            <div class="tagline" data-translate="hero.tagline">L'agent d'investissement transparent.</div>
          </div>
        </div>
      </header>

      <main style="padding: 4rem 0; text-align: center;">
        <div class="container">
          <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Demo Test Page</h1>
          <p style="font-size: 1.2rem; color: #666; margin-bottom: 2rem;">
            The workflow demo should auto-play when you load this page.<br>
            Once completed or closed, this content will be visible.
          </p>
          <button id="replay-demo" class="cta-button" style="background: linear-gradient(135deg, #333333, #444444); color: white; padding: 1rem 2rem; border: none; border-radius: 50px; cursor: pointer; font-size: 1rem; font-weight: 600;">
            Replay Demo
          </button>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="/i18n/translations.js"></script>
    <script src="/js/pricing-workflow-demo.js"></script>
  </body>
</html>
