<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Generation - Bubble</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: #f8f9fa;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            background: #1a1a1a;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #333;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .generated-image {
            margin-top: 1rem;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        .loading {
            display: none;
            margin-top: 1rem;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Test Image Generation</h1>
        <p>Test the OpenAI image generation pipeline for Bubble blog articles</p>
        
        <div style="margin-bottom: 2rem;">
            <button type="button" id="testConnectionBtn" style="background: #28a745; margin-bottom: 1rem;">
                Test API Connection
            </button>
            <button type="button" id="testDirectBtn" style="background: #17a2b8; margin-bottom: 1rem; margin-left: 1rem;">
                Test Sample Generation
            </button>
            <div id="connectionResult" style="display: none; padding: 1rem; border-radius: 6px; margin-bottom: 1rem;"></div>
        </div>
        
        <div style="margin-bottom: 2rem; padding: 1rem; background: #e3f2fd; border-radius: 8px;">
            <h3 style="margin-top: 0; color: #1976d2;">Quick Test Examples</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <button type="button" class="example-btn" onclick="loadExample(1)" style="padding: 0.5rem; background: #42a5f5; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    AI + Finance
                </button>
                <button type="button" class="example-btn" onclick="loadExample(2)" style="padding: 0.5rem; background: #66bb6a; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Investment Tech
                </button>
                <button type="button" class="example-btn" onclick="loadExample(3)" style="padding: 0.5rem; background: #ab47bc; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Cryptocurrency
                </button>
                <button type="button" class="example-btn" onclick="loadExample(4)" style="padding: 0.5rem; background: #ff7043; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Fintech Innovation
                </button>
            </div>
        </div>

        <form id="imageForm">
            <div class="form-group">
                <label for="title">Article Title *</label>
                <input type="text" id="title" name="title" required 
                       placeholder="e.g., L'IA révolutionne l'investissement financier">
            </div>
            
            <div class="form-group">
                <label for="summary">Article Summary</label>
                <textarea id="summary" name="summary" 
                          placeholder="Brief description of the article content..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" name="tags" 
                       placeholder="e.g., AI, finance, investment, technology">
            </div>
            
            <button type="submit" id="generateBtn">Generate Image</button>
        </form>
        
        <div class="loading" id="loading">
            🔄 Generating image... This may take up to 30 seconds.
        </div>
        
        <div class="result" id="result">
            <div id="resultMessage"></div>
            <img id="generatedImage" class="generated-image" style="display: none;">
        </div>
    </div>

    <script>
        // Load example data
        function loadExample(exampleNum) {
            const titleInput = document.getElementById('title');
            const summaryInput = document.getElementById('summary');
            const tagsInput = document.getElementById('tags');
            
            const examples = {
                1: {
                    title: "L'Intelligence Artificielle Révolutionne la Gestion de Portefeuille",
                    summary: "Comment les algorithmes d'IA transforment l'investissement moderne avec des analyses prédictives et une gestion automatisée des risques pour optimiser les rendements.",
                    tags: "AI, artificial intelligence, portfolio management, algorithmic trading, machine learning, fintech"
                },
                2: {
                    title: "The Future of Robo-Advisors in Wealth Management",
                    summary: "Exploring how automated investment platforms are democratizing wealth management through intelligent algorithms and data-driven portfolio optimization.",
                    tags: "robo-advisor, investment technology, automated investing, wealth management, digital finance"
                },
                3: {
                    title: "Cryptocurrency and DeFi: The Next Financial Revolution",
                    summary: "Analyzing the impact of decentralized finance protocols and digital assets on traditional banking and investment strategies.",
                    tags: "cryptocurrency, DeFi, blockchain, bitcoin, digital assets, web3, smart contracts"
                },
                4: {
                    title: "Fintech Startups Disrupting Traditional Banking",
                    summary: "How innovative financial technology companies are transforming banking services with mobile-first solutions and AI-powered financial products.",
                    tags: "fintech, innovation, digital banking, financial technology, startup, disruption"
                }
            };
            
            const example = examples[exampleNum];
            if (example) {
                titleInput.value = example.title;
                summaryInput.value = example.summary;
                tagsInput.value = example.tags;
            }
        }

        // Test direct OpenAI generation with sample payload
        document.getElementById('testDirectBtn').addEventListener('click', async function() {
            const btn = this;
            const result = document.getElementById('connectionResult');
            
            btn.disabled = true;
            btn.textContent = 'Testing Sample Generation...';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/blog/test-image-generation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: 'Sample OpenAI image generation diagnostic',
                        summary: 'Quick connectivity test to ensure the OpenAI image pipeline is working end-to-end.',
                        tags: ['diagnostic', 'openai', 'bubble']
                    })
                });
                const data = await response.json();

                result.style.display = 'block';
                if (data.success && data.imageUrl) {
                    result.className = 'result success';
                    result.innerHTML = `✅ ${data.message}<br><small>Image URL generated successfully.</small>`;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `❌ ${data.error || data.message || 'Generation failed'}<br><pre>${JSON.stringify(data.details || {}, null, 2)}</pre>`;
                }
            } catch (error) {
                result.style.display = 'block';
                result.className = 'result error';
                result.textContent = '❌ Network error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Test Sample Generation';
            }
        });

        // Test API connection
        document.getElementById('testConnectionBtn').addEventListener('click', async function() {
            const btn = this;
            const result = document.getElementById('connectionResult');
            
            btn.disabled = true;
            btn.textContent = 'Testing...';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/blog/test-image-service-connection');
                const data = await response.json();
                
                result.style.display = 'block';
                if (data.success) {
                    result.className = 'result success';
                    result.innerHTML = `✅ ${data.message}<br><small>API Key: ${data.apiKeyPresent ? 'Present' : 'Missing'}</small>`;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `❌ ${data.message}<br><small>API Key: ${data.apiKeyPresent ? 'Present' : 'Missing'}</small>`;
                }
            } catch (error) {
                result.style.display = 'block';
                result.className = 'result error';
                result.textContent = '❌ Connection test failed: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Test API Connection';
            }
        });

        document.getElementById('imageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const title = formData.get('title');
            const summary = formData.get('summary');
            const tagsString = formData.get('tags');
            const tags = tagsString ? tagsString.split(',').map(tag => tag.trim()) : [];
            
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const resultMessage = document.getElementById('resultMessage');
            const generatedImage = document.getElementById('generatedImage');
            
            // Reset UI
            result.style.display = 'none';
            generatedImage.style.display = 'none';
            loading.style.display = 'block';
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            
            try {
                const response = await fetch('/api/blog/test-image-generation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title,
                        summary,
                        tags
                    })
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                result.style.display = 'block';
                
                if (data.success && data.imageUrl) {
                    result.className = 'result success';
                    resultMessage.textContent = `✅ ${data.message}`;
                    generatedImage.src = data.imageUrl;
                    generatedImage.style.display = 'block';
                } else {
                    result.className = 'result error';
                    resultMessage.textContent = `❌ ${data.message || 'Image generation failed'}`;
                }
                
            } catch (error) {
                console.error('Error:', error);
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                resultMessage.textContent = '❌ Network error occurred';
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Image';
            }
        });
    </script>
</body>
</html>
