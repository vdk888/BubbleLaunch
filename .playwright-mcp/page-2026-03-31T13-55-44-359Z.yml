        - generic [ref=e132]:
          - generic [ref=e133]: Gestion d'actifs • Solution SaaS sur devis
          - heading "Veille & Reporting Intelligence" [level=4] [ref=e134]
          - paragraph [ref=e135]:
            - text: Un gérant multi-mandats peinait à suivre l'actualité de plus de 80 positions tout en fournissant un reporting personnalisé à chaque client.
            - strong [ref=e136]: "Solution :"
            - text: "Deux agents interconnectés : le premier scanne 50+ sources chaque matin et génère un brief par position, le second calcule les métriques en temps réel (sharpe, volatilité, drawdown, scoring ESG)."
            - strong [ref=e137]: "Résultat :"
            - text: 3h gagnées chaque matin • Reporting client instantané au lieu de 2 jours • +40% de couverture sur la détection des risques
        - generic [ref=e138]:
          - generic [ref=e139]: Architecte • Quick Start Pack
          - heading "Agent de Veille Réglementaire" [level=4] [ref=e140]
          - paragraph [ref=e141]:
            - text: Un cabinet d'architecture gérait 15 à 20 projets en parallèle. La veille réglementaire (urbanisme, sécurité, environnement) était faite à la main et causait des retards de conformité.
            - strong [ref=e142]: "Solution :"
            - text: Un agent qui scanne quotidiennement les mises à jour réglementaires par projet et localisation, envoie des alertes contextualisées et produit une synthèse mensuelle par dossier.
            - strong [ref=e143]: "Résultat :"
            - text: Zéro retard de conformité depuis le déploiement • Temps de veille divisé par 5 • Plus rien ne passe inaperçu
        - generic [ref=e144]:
          - generic [ref=e145]: Analyse Financière • Quick Start Pack
          - heading "Agent de Rédaction Notes & Research" [level=4] [ref=e146]
          - paragraph [ref=e147]:
            - text: Une équipe d'analyse recevait plus de 200 newsletters et rapports par jour. La synthèse manuelle pour les notes de crédit prenait 2 à 3 jours par semaine.
            - strong [ref=e148]: "Solution :"
            - text: Un agent qui lit automatiquement les sources par thème et secteur, extrait les points clés et génère des brouillons de notes structurés. Il alerte aussi si une position du portefeuille est mentionnée négativement.
            - strong [ref=e149]: "Résultat :"
            - text: −70% sur le temps de rédaction • Couverture complète des sources • L'équipe se concentre sur l'analyse qualitative plutôt que la collecte d'information
        - generic [ref=e150]:
          - generic [ref=e151]: Agence digitale • Solution SaaS sur devis
          - heading "Équipe d'Agents Social Media" [level=4] [ref=e152]
          - paragraph [ref=e153]:
            - text: Une agence gérait manuellement la présence de ses clients sur 5 réseaux sociaux. Création de contenu, veille tendances et publication prenaient 3 jours par semaine.
            - strong [ref=e154]: "Solution :"
            - text: "Une équipe de sous-agents orchestrés : un agent LinkedIn (articles + posts), un agent Instagram (visuels + reels), un agent TikTok (trends + scripts), un agent X/Twitter (threads + veille), et un agent Substack (newsletters). Un agent superviseur coordonne la ligne éditoriale et scanne les tendances."
            - strong [ref=e155]: "Résultat :"
            - text: Publication automatique sur 5 plateformes • Temps de création divisé par 4 • Couverture tendances en temps réel
        - generic [ref=e156]:
          - generic [ref=e157]: PME Tech • Quick Start Pack
          - heading "Agent de Business Development" [level=4] [ref=e158]
          - paragraph [ref=e159]:
            - text: Une PME de 20 personnes passait 2 jours par semaine à chercher des prospects qualifiés manuellement sur LinkedIn, les annuaires sectoriels et les appels d'offres publics.
            - strong [ref=e160]: "Solution :"
            - text: Un agent qui scanne quotidiennement les sources de leads (LinkedIn Sales Navigator, appels d'offres, actualités sectorielles), qualifie les prospects selon des critères définis, et génère des messages de prospection personnalisés.
            - strong [ref=e161]: "Résultat :"
            - text: +200% de leads qualifiés par mois • Temps de prospection divisé par 5 • Messages personnalisés à l'échelle
